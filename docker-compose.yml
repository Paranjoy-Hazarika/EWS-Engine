services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ews_engine
      SECRET_KEY: ${SECRET_KEY}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}
      ENABLE_SIMULATOR: ${ENABLE_SIMULATOR:-1}
      ESCALATE_AFTER_SECONDS: ${ESCALATE_AFTER_SECONDS:-60}
    ports:
      - "80:8000"
volumes:
  db_data:
